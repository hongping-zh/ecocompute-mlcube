name: 'EcoCompute validate report'
description: >-
  Validate an EcoCompute measurement report JSON against Protocol v1.1, using
  the same tools/validate.py the maintainers run — no Docker, no GPU, ~20 s.
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  report:
    description: >-
      Path(s) to the report JSON file(s), relative to the repository root.
      Space-separated for multiple files; shell globs are expanded.
    required: true
    default: ''
  profile:
    description: 'Validation profile: v1.1-core (default) or dataset-eligible.'
    required: false
    default: 'v1.1-core'
  validator-ref:
    description: >-
      Ref of hongping-zh/ecocompute-mlcube to run the validator from.
      Defaults to the ref this Action was invoked from (github.action_ref);
      pin a commit SHA or tag for reproducible CI.
    required: false
    default: ''
  python-version:
    description: 'Python version for the validator.'
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - name: Check out the validator (tools/validate.py + schema)
      uses: actions/checkout@v7
      with:
        repository: hongping-zh/ecocompute-mlcube
        # Same ref the caller pinned this Action to, unless the caller pins
        # the validator explicitly; an empty github.action_ref (local
        # self-test) falls back to main.
        ref: ${{ inputs.validator-ref != '' && inputs.validator-ref || github.action_ref || 'main' }}
        path: .ecocompute-validator
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install validator dependencies
      shell: bash
      run: pip install 'jsonschema>=4.0'
    - name: Validate report(s)
      shell: bash
      env:
        # Inputs reach the script ONLY through environment variables: direct
        # ${{ }} interpolation into the script text is a command-injection
        # surface in every calling repository (e.g. a PR title flowing into
        # `report`). Never interpolate inputs into run: again.
        REPORT_PATHS: ${{ inputs.report }}
        PROFILE: ${{ inputs.profile }}
      run: |
        case "$PROFILE" in
          v1.1-core|dataset-eligible) ;;
          *) echo "::error::unsupported profile '$PROFILE' (allowed: v1.1-core, dataset-eligible)"; exit 64 ;;
        esac
        status=0
        for f in $REPORT_PATHS; do
          echo "::group::validate $f ($PROFILE)"
          if ! python .ecocompute-validator/tools/validate.py "$f" --profile "$PROFILE"; then
            status=1
            echo "::error file=$f::validation failed — see the group above for the violations"
          fi
          echo "::endgroup::"
        done
        exit $status

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: contract tests (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests
      - name: shellcheck quickstart.sh
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck quickstart.sh
      # A CRLF line ending in any shell script breaks `curl ... | bash` on
      # Linux with "pipefail: invalid option name" (found by an external
      # reproducer, 2026-10-28). .gitattributes pins eol=lf on checkout;
      # this guards the committed blobs themselves.
      - name: shell scripts must be LF
        run: |
          bad=$(grep -rIl $'\r' --include='*.sh' . || true)
          if [ -n "$bad" ]; then
            echo "::error::CRLF line endings in: $bad"
            exit 1
          fi

  cpu-image:
    name: CPU image + MLCube contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the CPU verification image
        run: docker build -f Dockerfile.cpu -t ecocompute/mlcube-energy:cpu --build-arg ECOMPUTE_CODE_COMMIT=${{ github.sha }} --build-arg ECOMPUTE_IMAGE_REF=ecocompute/mlcube-energy:cpu .
      # No GPU on the runner, so this exercises the container contract (mounts,
      # parameters, report shape) and asserts the report is honest about it:
      # basis must not be "measured" when nothing was measured.
      - name: Run the task and check the report
        run: |
          mkdir -p out
          # --user: the image's default user is unprivileged (uid 1000); write to
          # the bind mount as the runner's own uid, like quickstart.sh does.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/out:/workspace/outputs" \
            ecocompute/mlcube-energy:cpu energy_estimate \
            --gpu_arch ada --params_b 1.1 --output_dir /workspace/outputs
          python3 - <<'PY'
          import json, sys
          r = json.load(open("out/energy.json"))
          assert r["certified_benchmark_result"] is False, r
          assert r["results"]["basis"] != "measured", r["results"]
          print("report OK:", r["results"])
          PY
      - name: Validate against the schema
        run: |
          pip install "jsonschema>=4.0"
          python3 -c "
          import json, jsonschema
          jsonschema.validate(json.load(open('out/energy.json')),
                              json.load(open('schema/energy.schema.json')))
          print('schema OK')"

  # The two jobs above build the image and drive the container directly with
  # `docker run`. This job drives it the way QUICKSTART.md documents: through
  # the real `mlcube` CLI, so the MLCube contract itself (workspace resolution,
  # type: file / type: directory parameter mounts, /mlcube_ioN task args) is
  # what's under test.
  mlcube-contract:
    name: MLCube runner path (mlcube run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # mlcube 0.0.9 pins omegaconf==2.1.0 (no wheels for Python >= 3.12) and
      # still imports distutils (removed in 3.12) — 3.10 it is, matching the
      # python:3.10-slim base image.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      # omegaconf 2.1.0 (pinned by mlcube 0.0.9) ships invalid metadata
      # ("PyYAML (>=5.1.*)"); pip >= 24.1 rejects it outright (found on the
      # first run of this job, 2026-11-23). Same fix as QUICKSTART.md.
      - run: python -m pip install "pip<24.1"
      - run: pip install "mlcube==0.0.9" "mlcube-docker==0.0.9"
      # The tag must equal the image named in mlcube.cpu.yaml.
      - name: Build the image mlcube.cpu.yaml points at
        run: docker build -f Dockerfile.cpu -t ecocompute/mlcube-energy:cpu-verify --build-arg ECOMPUTE_CODE_COMMIT=${{ github.sha }} --build-arg ECOMPUTE_IMAGE_REF=ecocompute/mlcube-energy:cpu-verify .
      - name: mlcube run (info log keeps mounts, task args and docker volumes)
        run: |
          set +e
          # --log-level is a group-level option: it must sit between `mlcube`
          # and `run`. After the subcommand, click passes it through as an
          # unknown option and mlcube 0.0.9's parse_extra_arg raises IndexError
          # on the '='-less token (found on this job's second run, 2026-11-23).
          mlcube --log-level info run --mlcube=mlcube.cpu.yaml --platform=docker \
            --task=energy_estimate -Pdocker.cpu_args="--user $(id -u):$(id -g)" \
            > mlcube-run.log 2>&1
          rc=$?
          set -e
          cat mlcube-run.log
          exit $rc
      - name: Assert the mount contract from the info log
        run: |
          # MLCube resolves parameter defaults against <mlcube dir>/workspace,
          # mounts parameter parent dirs as /mlcube_ioN (inputs first), and
          # passes --parameters_file=/mlcube_io0/energy_params.yaml. A
          # workspace/workspace path in the log means the defaults were
          # wrongly prefixed with "workspace/" (reproduced locally,
          # 2026-11-23: the yaml in this repo is correct).
          grep -q -- "--parameters_file=/mlcube_io0/energy_params.yaml" mlcube-run.log
          grep -q -- "--output_dir=/mlcube_io1" mlcube-run.log
          grep -q -- "workspace/parameters:/mlcube_io0" mlcube-run.log
          grep -q -- "workspace/outputs:/mlcube_io1" mlcube-run.log
          if grep -q "workspace/workspace" mlcube-run.log; then
            echo "::error::mount table shows doubled workspace/ path"
            exit 1
          fi
      - name: Assert the report (params actually read, honesty, no quality)
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open("workspace/outputs/energy.json"))
          w = r["workload"]
          # The parameters file must actually be mounted and read. params_b is
          # the sentinel: when the file is missing, load_params() silently
          # falls back to setdefault() values — and every other field's
          # fallback happens to equal the yaml value; only params_b falls back
          # to None (verified locally, 2026-11-23). "A report was produced"
          # proves nothing; these values do.
          assert w["model_name"] == "TinyLlama/TinyLlama-1.1B-Chat-v1.0", w
          assert w["params_b"] == 1.1, w
          assert w["precision"] == "NF4", w
          assert r["measurement"]["iterations"] == 10, r["measurement"]
          assert (r["thermal"]["mode"], r["thermal"]["warmup_runs"]) == ("cold", 2), r["thermal"]
          # Honesty: no GPU on the runner, so never a fabricated measurement.
          # (basis is "unavailable" here, not "reference": gpu_arch=auto
          # cannot map without NVML — assert "!= measured", not a specific value.)
          assert r["certified_benchmark_result"] is False, r
          assert r["results"]["basis"] != "measured", r["results"]
          assert r["measurement_source"].startswith("ecocompute-dataset"), r
          # Container identity: the image was built in THIS job from THIS
          # commit, so the report must trace back to exactly that. The
          # registry tag is a moving label (0.1.0 re-pushed per release);
          # code_commit is what an archived report is traced by: recorded at
          # build time by this job. Traceability, not endorsement — anyone
          # can rebuild with a different value (see TECHNICAL.md).
          assert r["provenance"]["code_commit"] == "${{ github.sha }}", r["provenance"]
          assert r["provenance"]["image"] == "ecocompute/mlcube-energy:cpu-verify", r["provenance"]
          # No quality section on the no-GPU path. The probe only runs on the
          # measuring path (resolve_quality is called under gpu_available()),
          # so the "quality probe disabled" stderr line never appears here —
          # do not grep for it.
          assert r.get("quality") is None, r.get("quality")
          print("mlcube contract OK:", r["measurement_source"], "|", r["results"]["basis"])
          PY
      # Counter-proof (mount-verification steps, section 4): point the
      # parameters_file at a nonexistent file. MLCube does not fail — it
      # silently mkdirs an empty dir — and the container's fallbacks absorb
      # everything except params_b. If this run leaves params_b=None, the
      # sentinel above is proven load-bearing.
      - name: Counter-proof — a missing parameters file must trip the sentinel
        run: |
          sed -i 's#default: parameters/energy_params.yaml#default: parameters/DOES_NOT_EXIST.yaml#' mlcube.cpu.yaml
          mlcube run --mlcube=mlcube.cpu.yaml --platform=docker --task=energy_estimate \
            -Pdocker.cpu_args="--user $(id -u):$(id -g)" \
            > mlcube-sabotage.log 2>&1 || true
          cat mlcube-sabotage.log
          python3 - <<'PY'
          import json
          r = json.load(open("workspace/outputs/energy.json"))
          w = r["workload"]
          assert w["params_b"] is None, w
          assert r["certified_benchmark_result"] is False, r
          print("counter-proof OK: params_b is None — the sentinel is load-bearing")
          PY

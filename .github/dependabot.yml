# Weekly dependency updates (opened as PRs for review, never auto-merged).
# NOTE: pip is deliberately NOT configured here. requirements.lock.txt is the
# fully-pinned reproducibility asset for measurements (see its header) — it
# does not accept automated bumps. Dependency refreshes happen manually at
# release boundaries, after container re-validation.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
